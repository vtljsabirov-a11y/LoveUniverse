
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05050b">

    <title>Моя маленькая вселенная</title>

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Космическая сцена -->
    <canvas id="space"></canvas>

    <!-- Начальный экран -->
    <header class="intro" id="intro">
        <div class="eyebrow">
            Маленькая вселенная для тебя
        </div>

        <h1>У любви нет границ</h1>

        <p>Иногда даже у бесконечности есть центр</p>
    </header>

    <!-- Подсказка -->
    <div class="hint" id="hint">
        КОСНИСЬ ЧЁРНОЙ ДЫРЫ
    </div>

    <!-- Финальное послание -->
    <section class="message" id="message">

        <div class="message-content">

            <div class="eyebrow">
                СРЕДИ БЕСКОНЕЧНОСТИ
            </div>

            <h2>
                Среди бесконечности есть
                миллиарды возможностей.
            </h2>

            <p>
                И мне нравится, что одна из них
                привела меня к тебе.
            </p>

            <div class="final-star">✦</div>

            <button class="back-button" id="backButton">
                ВЕРНУТЬСЯ КО ВСЕЛЕННОЙ
            </button>

        </div>

    </section>

    <!-- Подключение JavaScript -->
    <script src="script.js"></script>

</body>
</html>
